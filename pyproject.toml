[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "badpcb"
version = "0.1.0"
description = "Agent-facing PCB routing kernel: named-handle reports, placement audit, what-if actions, sessions, a global router and a KiCadRoutingTools backend"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}
classifiers = ["License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"]
dependencies = []

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
badpcb = "badpcb.cli:main"

[tool.setuptools]
packages = ["badpcb"]
